[project]
name = "presentation-sanity"
version = "0.2.0"
description = "Build slides and blogs from a single manifest.yaml — shared variables, provenance, manim scenes and figures, rendered by Slidev and VitePress."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
manim = ["manim>=0.18"]
pptx = ["python-pptx>=0.6"]

[project.scripts]
presentation-sanity = "presentation_sanity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_sanity"]
